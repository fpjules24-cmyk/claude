<title>Donjons & Tractions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Donjons & Tractions — interface pixel art, écran de jeu vertical pensé pour le téléphone */
:root {
  /* Disposition : HUD collé en haut, contenu défilant au centre, barre d'onglets en bas (une colonne de 520px max) */
  --ink: #1a1c2c;       /* contours et fond profond */
  --night: #20233a;     /* fond de page */
  --slate: #333c57;     /* panneaux */
  --slate-2: #2a3150;   /* fenêtres */
  --steel: #566c86;     /* bords et reliefs */
  --mist: #94b0c2;      /* texte secondaire */
  --chalk: #f4f4f4;     /* texte */
  --gold: #ffcd75;      /* pièces */
  --ember: #ef7d57;     /* action chaude */
  --brick: #b13e53;     /* danger */
  --lime: #a7f070;      /* énergie, validation */
  --grass: #38b764;
  --cyan: #73eff7;      /* éclats */
  --sky: #41a6f6;
  --navy: #29366f;
  --plum: #5d275d;
  --font-px: "Press Start 2P", "Courier New", ui-monospace, monospace;
  --font-body: "VT323", "Courier New", ui-monospace, monospace;
  --b: 3px;
  --px: 0 calc(-1 * var(--b)) 0 0 var(--ink), 0 var(--b) 0 0 var(--ink), calc(-1 * var(--b)) 0 0 0 var(--ink), var(--b) 0 0 0 var(--ink);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image: radial-gradient(rgba(115, 239, 247, 0.05) 1px, transparent 1px);
  background-size: 6px 6px;
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 1.15;
  overscroll-behavior: none;
}
img.ico, .nav-i, .thumb, .item-ico, .anim, .stage, .boss-img, .raid-ico, .dthumb, .chest-ico, .chest-big, .bt-order img { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; }
button * { pointer-events: none; }
h1, h2, h3, h4 { font-family: var(--font-px); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: 0.02em; }
h3 { font-size: 11px; margin: 18px 0 10px; color: var(--gold); }
h4 { font-size: 9px; margin: 14px 0 6px; color: var(--mist); text-transform: uppercase; letter-spacing: 0.08em; }
p { margin: 6px 0; }
small { font-size: 17px; color: var(--mist); }
b { font-weight: 400; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
[hidden] { display: none !important; }

#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--night); box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 0 60px rgba(0,0,0,.4); }

/* ---------- HUD ---------- */
.hud { position: sticky; top: 0; z-index: 20; background: var(--ink); padding: 8px 12px 6px; border-bottom: 3px solid #000; }
.hud-row { display: flex; gap: 8px; align-items: center; }
.hud-cell { display: flex; align-items: center; gap: 6px; background: var(--slate); border: 0; padding: 4px 8px; min-height: 40px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); }
.hud-cell b { font-family: var(--font-px); font-size: 12px; font-variant-numeric: tabular-nums; }
.hud-cell small { font-family: var(--font-px); font-size: 7px; color: var(--mist); }
.hud-cell .col { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.hud-coins { flex: 1; min-width: 0; }
.hud-coins b { color: var(--gold); font-size: 13px; }
.hud-gems b { color: var(--cyan); }
.hud-en b { color: var(--lime); }
.hud-gear { background: transparent; border: 0; padding: 6px; min-height: 40px; cursor: pointer; }
.hud-row2 { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.lvl { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; padding: 0; cursor: pointer; flex: 1; min-width: 120px; }
.lvl span { font-family: var(--font-px); font-size: 9px; color: var(--chalk); white-space: nowrap; }
.lvl .bar { flex: 1; background: var(--slate); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-px); font-size: 7px; padding: 4px 6px; background: var(--slate); }
.chip.pump { color: var(--ember); }
.chip.streak { color: var(--gold); }
.chip.net { color: var(--cyan); }
.chip .ico { width: 12px; height: 12px; }

.ico { width: 16px; height: 16px; vertical-align: middle; flex: none; }
.ico.big { width: 24px; height: 24px; }
.amt { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.amt b { font-family: var(--font-px); font-size: 10px; font-variant-numeric: tabular-nums; }
.amt.coin b { color: var(--gold); }
.amt.gem b { color: var(--cyan); }

/* ---------- Contenu ---------- */
main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 28px; -webkit-overflow-scrolling: touch; }
.screen { display: flex; flex-direction: column; gap: 12px; }
.scr-t { font-size: 16px; color: var(--chalk); margin: 2px 0 4px; text-shadow: 3px 3px 0 var(--ink); }
.intro { color: var(--mist); margin: 0; }
.muted { color: var(--mist); }
.center { text-align: center; }
.gold-t { color: var(--gold); font-family: var(--font-px); font-size: 12px; }
.gem-t { color: var(--cyan); font-family: var(--font-px); font-size: 10px; }
.lbl { font-family: var(--font-px); font-size: 8px; letter-spacing: 0.08em; color: var(--mist); text-transform: uppercase; }
.big-n { font-family: var(--font-px); font-size: 16px; color: var(--gold); }
.row { display: flex; align-items: center; flex-wrap: wrap; }
.row.gap { gap: 10px; }
.row.between { justify-content: space-between; gap: 8px; }
.row.center { justify-content: center; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hint { text-align: center; color: var(--mist); font-size: 17px; margin: -4px 0 0; }
.lead { font-size: 22px; }
.list { padding-left: 20px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }

.card { background: var(--slate); padding: 12px 12px 16px; box-shadow: var(--px), inset 0 -4px 0 rgba(0,0,0,.2); margin: var(--b); display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* ---------- Boutons ---------- */
.btn {
  --bg: var(--steel); --fg: var(--chalk);
  font-family: var(--font-px); font-size: 10px; line-height: 1.3; letter-spacing: 0.02em;
  background: var(--bg); color: var(--fg); border: 0; cursor: pointer;
  padding: 12px 14px; min-height: 44px; margin: var(--b);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
  box-shadow: inset -3px -4px 0 0 rgba(0,0,0,.3), inset 3px 3px 0 0 rgba(255,255,255,.22), var(--px);
  transition: transform .05s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 3px 3px 0 0 rgba(0,0,0,.3), var(--px); }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
.btn.go { --bg: var(--grass); }
.btn.gold { --bg: var(--gold); --fg: var(--ink); }
.btn.gold .amt.coin b { color: var(--ink); }
.btn.ghost { --bg: var(--slate); }
.btn.danger { --bg: var(--brick); }
.btn.danger-t { color: #ff9aa8; }
.btn.gemb { --bg: var(--navy); --fg: var(--cyan); }
.btn.sm { font-size: 8px; padding: 8px 10px; min-height: 36px; }
.btn.wide { width: calc(100% - 2 * var(--b)); }
.btn.big { font-size: 12px; padding: 16px; min-height: 52px; }
.btn.on { --bg: var(--grass); }
.btn.pulse { animation: pulse 1.4s infinite; }
@keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }

.bar { height: 8px; background: var(--ink); position: relative; overflow: hidden; min-width: 40px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--lime); transition: width .2s; }
.bar.xp > i { background: var(--sky); }
.bar.ms { height: 5px; margin-top: 3px; }
.bar.ms > i { background: var(--gold); }
.bar.irlbar { height: 5px; margin-top: 3px; }
.bar.irlbar > i { background: var(--ember); }
.bar.raidbar { height: 12px; }
.bar.raidbar > i { background: var(--brick); }

/* Segments et puces */
.seg { display: flex; gap: 0; background: var(--ink); padding: 3px; margin: var(--b); }
.seg button { flex: 1; background: transparent; border: 0; color: var(--mist); font-family: var(--font-px); font-size: 8px; padding: 10px 4px; min-height: 40px; cursor: pointer; }
.seg button.on { background: var(--slate); color: var(--chalk); box-shadow: inset 0 -3px 0 var(--gold); }
.seg.small button { font-size: 8px; min-height: 34px; padding: 6px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-b { --bc: var(--mist); background: var(--slate); border: 0; color: var(--chalk); font-family: var(--font-body); font-size: 18px; padding: 6px 10px; min-height: 36px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); }
.chip-b.on { background: var(--bc); color: var(--ink); }
.chip-b:not(.on) { border-left: 3px solid var(--bc); }
.chip-b:disabled { opacity: .4; cursor: not-allowed; }
.chip-b.done:not(.on) { color: var(--lime); }
.pill { font-family: var(--font-px); font-size: 7px; padding: 4px 6px; background: var(--ink); color: var(--mist); display: inline-block; }
.pill.gold { color: var(--gold); }
.tag { font-family: var(--font-px); font-size: 7px; font-style: normal; color: var(--lime); background: var(--ink); padding: 4px 5px; white-space: nowrap; }

/* ---------- Navigation ---------- */
.nav { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--ink); border-top: 3px solid #000; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.nav-b { position: relative; background: transparent; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; min-height: 56px; cursor: pointer; color: var(--mist); }
.nav-b span { font-family: var(--font-px); font-size: 6.5px; white-space: nowrap; }
.nav-i { width: 24px; height: 24px; filter: grayscale(.6) brightness(.8); }
.nav-b.on { color: var(--gold); background: var(--slate); }
.nav-b.on .nav-i { filter: none; transform: translateY(-1px); }
.badge { position: absolute; top: 2px; right: 14%; min-width: 16px; height: 16px; padding: 0 3px; background: var(--brick); color: var(--chalk); font-family: var(--font-px); font-size: 7px; font-style: normal; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--ink); }

/* ---------- Scène ---------- */
.stage-wrap { width: 100%; display: flex; justify-content: center; background: var(--ink); padding: var(--b); box-shadow: var(--px); margin: var(--b); width: calc(100% - 2 * var(--b)); position: relative; }
.stage { display: block; touch-action: manipulation; cursor: pointer; max-width: 100%; }
.prodcard b { font-family: var(--font-px); font-size: 12px; color: var(--gold); }
.pump-line { color: var(--mist); margin: 0; }
.pump-line.on { color: var(--ember); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--slate); border: 0; padding: 12px 10px; margin: var(--b); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; cursor: pointer; text-align: left; box-shadow: var(--px), inset 0 -4px 0 rgba(0,0,0,.2); min-height: 92px; }
.tile b { font-family: var(--font-px); font-size: 9px; line-height: 1.4; }
.tile small, .badge-in { font-size: 16px; color: var(--mist); }
.badge-in.hot { color: var(--gold); }
.daily:empty { display: none; }

/* ---------- Fenêtres ---------- */
#sheets { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.sheet-wrap { position: absolute; inset: 0; background: rgba(10, 10, 20, 0); display: flex; align-items: flex-end; justify-content: center; pointer-events: auto; transition: background .18s; }
.sheet-wrap.open { background: rgba(10, 10, 20, 0.65); }
.sheet { width: 100%; max-width: 520px; max-height: 90%; background: var(--slate-2); border-top: 3px solid var(--steel); box-shadow: 0 -3px 0 var(--ink); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .18s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-wrap.open .sheet { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
.sheet-head h2 { font-size: 12px; color: var(--gold); line-height: 1.4; }
.sheet-head .x { background: var(--slate); border: 0; width: 40px; height: 40px; font-size: 26px; line-height: 1; cursor: pointer; flex: none; color: var(--chalk); }
.sheet-body { overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.sheet.battle, .sheet.player { max-height: 100%; height: 100%; }
.sheet.battle .sheet-head, .sheet.player .sheet-head { display: none; }
.sheet.battle .sheet-body, .sheet.player .sheet-body { padding-top: calc(12px + env(safe-area-inset-top, 0px)); height: 100%; }
.sheet.player .sheet-head { display: flex; }
.sheet.onboard { max-height: 100%; }
.reward .rw-list { display: flex; flex-direction: column; gap: 8px; }
.rw { display: flex; align-items: center; gap: 10px; background: var(--slate); padding: 10px; margin: var(--b); box-shadow: var(--px); }
.rw b { font-family: var(--font-px); font-size: 11px; color: var(--gold); }

/* ---------- Notifications ---------- */
#toasts { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(92vw, 480px); display: flex; flex-direction: column; gap: 4px; z-index: 80; pointer-events: none; }
.toast { background: rgba(26, 28, 44, .94); color: var(--chalk); padding: 7px 10px; box-shadow: var(--px); border-left: 4px solid var(--steel); animation: tin .2s ease-out; font-size: 18px; line-height: 1.1; }
body.sheet-open #toasts { bottom: auto; top: calc(8px + env(safe-area-inset-top, 0px)); }
.toast.good { border-left-color: var(--lime); }
.toast.bad { border-left-color: var(--brick); }
.toast.gold { border-left-color: var(--gold); color: var(--gold); }
.toast.gem { border-left-color: var(--cyan); color: var(--cyan); }
.toast.big { font-size: 19px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
#floats { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.float { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-px); font-size: 11px; text-shadow: 2px 2px 0 var(--ink); animation: fup 1s ease-out forwards; white-space: nowrap; }
@keyframes fup { to { transform: translate(-50%, -260%); opacity: 0; } }

/* ---------- Vignettes ---------- */
.thumb { width: 72px; height: 72px; background: var(--ink); flex: none; display: block; }
.thumb.sm { width: 48px; height: 48px; }
.thumb.xs { width: 36px; height: 36px; }
.thumb.pet { background: var(--navy); padding: 12px; }
.thumb.none { display: flex; align-items: center; justify-content: center; font-family: var(--font-px); color: var(--mist); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.thumbbtn { background: var(--slate); border: 0; padding: 8px 6px; margin: var(--b); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; box-shadow: var(--px); text-align: center; }
.thumbbtn small { font-size: 16px; color: var(--chalk); line-height: 1; }
.thumbbtn em { font-style: normal; font-size: 14px; color: var(--mist); line-height: 1; }
.thumbbtn.on { background: var(--navy); box-shadow: var(--px), inset 0 0 0 3px var(--gold); }
.thumbbtn.lockd small { color: var(--mist); }
.anim-wrap { background: var(--ink); padding: 3px; flex: none; }
.anim-wrap.big { width: 100%; display: flex; justify-content: center; }
.anim-wrap.mid { width: 140px; }
.anim { display: block; max-width: 100%; }

/* ---------- Sport ---------- */
.exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.excard { background: var(--slate); border: 0; padding: 10px 8px; margin: var(--b); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; box-shadow: var(--px), inset 0 -4px 0 rgba(0,0,0,.2); text-align: center; min-width: 0; }
.excard .thumb { width: 96px; height: 96px; }
.excard b { font-size: 20px; line-height: 1; }
.excard small { font-size: 15px; line-height: 1.05; }
.excard .tot { color: var(--gold); }
.excard:active { transform: translateY(2px); }
.logger-top { display: flex; gap: 12px; align-items: center; }
.logger-top .anim-wrap.big { width: 50%; max-width: 220px; }
.tip { color: var(--mist); margin: 0; font-size: 18px; }
.count { font-family: var(--font-px); font-size: 34px; color: var(--chalk); text-align: center; font-variant-numeric: tabular-nums; text-shadow: 3px 3px 0 var(--ink); }
.tap-pad { width: calc(100% - 2 * var(--b)); margin: var(--b); min-height: 150px; background: var(--navy); border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: var(--px), inset 0 -6px 0 rgba(0,0,0,.3); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.tap-pad small { font-family: var(--font-px); font-size: 8px; color: var(--cyan); }
.tap-pad.hit { animation: hit .15s; }
.tap-pad.timer { cursor: default; }
@keyframes hit { 50% { background: var(--sky); } }
.logger input[type=number] { width: 96px; }
input[type=text], input[type=number], textarea {
  font-family: var(--font-body); font-size: 22px; background: var(--ink); color: var(--chalk); border: 0; padding: 8px 10px; min-height: 44px; margin: var(--b);
  box-shadow: inset 0 0 0 3px var(--steel);
}
input[type=text] { width: calc(100% - 2 * var(--b)); }
textarea.code { width: calc(100% - 2 * var(--b)); font-size: 15px; word-break: break-all; resize: vertical; }
.preview { text-align: center; min-height: 26px; }
.rest { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; background: var(--ink); padding: 8px; }
.rest b { font-family: var(--font-px); font-size: 12px; color: var(--lime); }
.honor { text-align: center; color: var(--mist); font-size: 16px; }
.cfg { display: flex; flex-direction: column; gap: 6px; }
.plan h4 { color: var(--gold); }
.plan-it { display: flex; align-items: center; gap: 10px; }
.plan-it span { flex: 1; min-width: 0; }
.plan-it b { font-family: var(--font-px); font-size: 9px; color: var(--lime); white-space: nowrap; }
.pl-head { font-family: var(--font-px); font-size: 9px; color: var(--mist); }
.player h3 { margin: 0; font-size: 12px; color: var(--chalk); line-height: 1.4; }
.pl-target { font-family: var(--font-px); font-size: 10px; color: var(--gold); line-height: 1.5; }
.pl-ctrl { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; height: 140px; align-items: end; }
.chart .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; }
.chart .col i { display: block; width: 100%; background: var(--steel); min-height: 2px; }
.chart .col.ok i { background: var(--lime); }
.chart .col.today i { box-shadow: 0 0 0 2px var(--gold); }
.chart .col small { font-size: 14px; }
.chart .col .v { font-size: 13px; color: var(--chalk); }
.statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.statgrid .st { background: var(--slate); padding: 10px; margin: var(--b); box-shadow: var(--px); display: flex; flex-direction: column; gap: 6px; }
.statgrid .st b { font-family: var(--font-px); font-size: 13px; color: var(--gold); }
.stats { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.stats li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px dashed rgba(148, 176, 194, .2); }
.stats li span { flex: 1; color: var(--mist); min-width: 0; }
.stats li b { font-family: var(--font-px); font-size: 10px; text-align: right; }
.stats li em { font-style: normal; font-size: 16px; color: var(--mist); }
.stats li em.up { color: var(--lime); }
.stats li em.down { color: #ff8a9a; }
.stats li.aff b { color: var(--cyan); font-family: var(--font-body); font-size: 19px; }
.stats.tight li { padding: 2px 0; }
.loglist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.loglist li { display: flex; gap: 8px; align-items: baseline; }
.loglist li span { flex: 1; }
.loglist li b { font-family: var(--font-px); font-size: 9px; color: var(--lime); }

/* ---------- Skills ---------- */
.sumcard small { font-size: 16px; }
.skilllist { display: flex; flex-direction: column; gap: 10px; }
.brh { margin: 12px 0 2px; font-size: 10px; }
.skill { display: flex; align-items: stretch; background: var(--slate); margin: var(--b); box-shadow: var(--px), inset 0 -4px 0 rgba(0,0,0,.2); }
.skill-main { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; background: transparent; border: 0; padding: 8px; text-align: left; cursor: pointer; }
.skill-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }

  const sprCache = {};
  function spriteCanvas(map, pal, opts = {}) {
    const key = (opts.key || map.join('')) + '|' + JSON.stringify(pal) + (opts.white ? 'W' : '') + (opts.flip ? 'F' : '');
    if (sprCache[key]) return sprCache[key];

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    for (let y = 0; y < h; y++) {
      const row = map[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (ch === '.' || ch === ' ' || ch === undefined) continue;
        const col = opts.white ? (ch === 'o' ? '#ffffff' : '#ffffff') : (pal[ch] || DEF_PAL[ch] || IPAL[ch] || '#ff00ff');
        ctx.fillStyle = col;
        ctx.fillRect(opts.flip ? w - 1 - x : x, y, 1, 1);

  // Calcule les articulations d'une pose à l'instant t (secondes)
  function poseAt(id, time, once) {
    const p = POSES[id] || POSES.idle;
    if (p.R.length === 1) return joints(p.R[0], p.R[0], 0);
    let tt = once ? Math.min(time, p.total - 1e-4) : time % p.total;
    for (let i = 0; i < p.f.length; i++) {
      const d = p.f[i].d;
      if (tt < d || i === p.f.length - 1) {
        const u = Math.min(1, tt / d);
        const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; // easeInOut
        const next = once && i === p.f.length - 1 ? i : (i + 1) % p.f.length;
        return joints(p.R[i], p.R[next], e);
      }
      tt -= d;
    }
    return joints(p.R[0], p.R[0], 0);
  }

  // ---------- Apparence ----------
  function lookFor(base, skinId) {
    const sk = DT.D.SKIN[skinId] || DT.D.SKIN.base;
    return Object.assign({ skin: '#e8b48a', hair: '#5b3a29', hs: 'short', top: '#b13e53', sleeves: 'short', bottom: '#333c57', pants: 'short', shoes: '#f4f4f4', hat: null, acc: '#ffcd75', cape: null }, base || {}, sk.look);
  }

  // ---------- Rendu pixel d'une figure ----------
  // On dessine dans une table de pixels (clé "x,y"), puis on vide sur le contexte.
  function Pix() { this.m = new Map(); }
  Pix.prototype.set = function (x, y, c) { this.m.set((x | 0) + ',' + (y | 0), c); };
  Pix.prototype.sq = function (x, y, w, c) {
    const x0 = Math.round(x - (w - 1) / 2), y0 = Math.round(y - (w - 1) / 2);
    for (let i = 0; i < w; i++) for (let j = 0; j < w; j++) this.set(x0 + i, y0 + j, c);
  };
  Pix.prototype.seg = function (a, b, w, c) {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.ceil(len * 2));
    for (let i = 0; i <= n; i++) this.sq(a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n, w, c);
  };

  function drawLimb(P, pts, w1, w2, c1, c2, endC, endW) {
    P.seg(pts[0], pts[1], w1 + 2, OUT);
    P.seg(pts[1], pts[2], w2 + 2, OUT);
    if (endC) P.sq(pts[2][0], pts[2][1], endW + 2, OUT);
    P.seg(pts[0], pts[1], w1, c1);
    P.seg(pts[1], pts[2], w2, c2);
    if (endC) P.sq(pts[2][0], pts[2][1], endW, endC);
  }

  function figurePixels(J, look, opts) {
    const P = new Pix();
    const L = look;
    const far = 0.72;
    const skin = L.skin, top = L.top, bot = L.bottom;
    const bones = !!L.bones;
    const wA = bones ? 1 : 2, wTh = bones ? 1 : 3, wSh = bones ? 1 : 2;
    const sleeveU = (c) => (L.sleeves === 'none' ? c : top);
    const sleeveL = (c) => (L.sleeves === 'long' ? top : c);
    const shinC = L.pants === 'long' ? bot : skin;
    const up = dir(J.t); // de la nuque vers le haut de la tête
    const fwd = [-up[1], up[0]];

    // Cape (derrière tout)
    if (L.cape) {
      const back = [-fwd[0], -fwd[1]];
      const wave = Math.sin((opts && opts.time || 0) * 6) * 0.8;
      const tip = [J.hip[0] + back[0] * 4 + wave, J.hip[1] + 3];
      P.seg(J.sh, tip, 5, OUT);
      P.seg(J.sh, tip, 3, L.cape);
    }
    // Membres arrière
    drawLimb(P, J.af, wA, wA, shade(sleeveU(skin), far), shade(sleeveL(skin), far), shade(skin, far), 2);
    drawLimb(P, J.lf, wTh, wSh, shade(bot, far), shade(shinC, far), shade(L.shoes, far), 2);
    // Torse
    {
      const len = Math.hypot(J.sh[0] - J.hip[0], J.sh[1] - J.hip[1]);
      const n = Math.ceil(len * 2);
      const wFill = bones ? 2 : 4;
      for (let i = 0; i <= n; i++) {
        const x = J.hip[0] + (J.sh[0] - J.hip[0]) * i / n, y = J.hip[1] + (J.sh[1] - J.hip[1]) * i / n;
        P.sq(x, y, wFill + 2, OUT);
      }
      for (let i = 0; i <= n; i++) {
        const x = J.hip[0] + (J.sh[0] - J.hip[0]) * i / n, y = J.hip[1] + (J.sh[1] - J.hip[1]) * i / n;
        let c = top;
        if (bones) c = (i % 4 < 2) ? '#f4f4f4' : '#c2d3de';
        else if (i < 2) c = bot; // ceinture / short
        else if (i > n - 3 && L.sleeves === 'none' && top === skin) c = skin;
        P.sq(x, y, wFill, c);
      }
    }
    // Jambe avant
    drawLimb(P, J.ln, wTh, wSh, bot, shinC, L.shoes, 2);
    // Tête (dessinée après le bras quand le corps est à l'envers, sinon elle serait cachée)
    const drawHead = () => {
    const hc = [Math.round(J.head[0]), Math.round(J.head[1])];
    for (let dx = -3; dx <= 3; dx++) for (let dy = -3; dy <= 3; dy++) {
      const d2 = dx * dx + dy * dy;
      if (d2 <= 10) P.set(hc[0] + dx, hc[1] + dy, OUT);
    }
    for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) {
      const d2 = dx * dx + dy * dy;
      if (d2 > 5) continue;
      const du = dx * up[0] + dy * up[1], df = dx * fwd[0] + dy * fwd[1];
      let c = skin;
      if (L.hs !== 'bald' && L.hair !== 'bald') {
        const hair = L.hs === 'fire' || L.hair === 'fire' ? (du > 1.5 ? '#ffcd75' : '#ef7d57') : L.hair;
        if (du >= 0.8) c = hair;
        if (L.hs === 'long' && df <= -0.8 && du >= -1.6) c = hair;
        if (L.hs === 'bun' && df <= -1.2 && du >= -0.5) c = hair;
      }
      if (L.beard && du <= -0.8 && df >= -0.6) c = L.beard;
      P.set(hc[0] + dx, hc[1] + dy, c);
    }
    const hp = (f, u, c) => P.set(Math.round(hc[0] + fwd[0] * f + up[0] * u), Math.round(hc[1] + fwd[1] * f + up[1] * u), c);
    // Œil
    hp(1.3, 0.2, L.eye || OUT);
    if (L.patch) { hp(1.3, 0.2, OUT); hp(0, 1.2, OUT); hp(-1, 1.6, OUT); }
    // Coiffures en relief
    if (L.hs === 'mohawk' && L.hair !== 'bald') { hp(0, 3, OUT); hp(0, 4, OUT); hp(-1, 3, L.hair); hp(0, 3, L.hair); hp(1, 3, L.hair); hp(0, 4, OUT); }
    if (L.hs === 'bun' && L.hair !== 'bald') { hp(-3, 1, OUT); hp(-3, 2, L.hair); hp(-4, 2, OUT); hp(-3, 3, OUT); }
    if (L.hs === 'fire' || L.hair === 'fire') { const t = (opts && opts.time) || 0; const k = Math.floor(t * 8) % 2; hp(0, 3, '#ffcd75'); hp(-1, 3 + k, '#ef7d57'); hp(1, 3 + (1 - k), '#ef7d57'); hp(0, 4 + k, '#b13e53'); }
    // Chapeaux
    const acc = L.acc || '#b13e53';
    switch (L.hat) {
      case 'headband': for (let f = -2; f <= 2; f++) hp(f, 1, acc); hp(-3, 1, acc); hp(-4, 0, acc); hp(-4, 1, acc); break;
      case 'cap': for (let f = -2; f <= 2; f++) { hp(f, 2, acc); hp(f, 1, acc); } hp(3, 1, acc); hp(4, 1, OUT); hp(-1, 3, OUT); hp(0, 3, OUT); hp(1, 3, OUT); break;

      case 'viking': for (let f = -2; f <= 2; f++) { hp(f, 1, '#94b0c2'); hp(f, 2, '#c2d3de'); } hp(-3, 2, '#f4f4f4'); hp(-3, 3, '#f4f4f4'); hp(-4, 4, OUT); hp(3, 2, '#f4f4f4'); hp(3, 3, '#f4f4f4'); hp(4, 4, OUT); break;
      case 'visor': for (let f = -1; f <= 3; f++) hp(f, 0.4, acc); hp(-2, 1, OUT); break;
      case 'laurel': hp(-2, 2, '#38b764'); hp(-3, 1, '#a7f070'); hp(2, 2, '#38b764'); hp(3, 1, '#a7f070'); hp(-1, 3, '#38b764'); hp(1, 3, '#38b764'); break;
      case 'crown': for (let f = -2; f <= 2; f++) hp(f, 2, '#ffcd75'); hp(-2, 3, '#ffcd75'); hp(0, 3, '#ffcd75'); hp(2, 3, '#ffcd75'); hp(-2, 4, OUT); hp(0, 4, OUT); hp(2, 4, OUT); hp(0, 2, '#b13e53'); break;
      case 'spartan': for (let f = -2; f <= 2; f++) { hp(f, 0, '#c08a40'); hp(f, 1, '#c08a40'); hp(f, 2, '#e0aa60'); } hp(1, 0, OUT); hp(2, -1, '#c08a40'); hp(-2, -1, '#c08a40'); for (let f = -3; f <= 2; f++) hp(f, 3, '#b13e53'); for (let f = -2; f <= 1; f++) hp(f, 4, '#b13e53'); break;
      case 'pirate': for (let f = -2; f <= 2; f++) { hp(f, 1, acc); hp(f, 2, acc); } hp(-3, 1, acc); hp(-4, 0, acc); hp(-4, -1, acc); break;
      case 'pharaoh': for (let f = -2; f <= 2; f++) { hp(f, 1, '#ffcd75'); hp(f, 2, '#3b5dc9'); } for (let u = -2; u <= 1; u++) { hp(-3, u, u % 2 ? '#3b5dc9' : '#ffcd75'); hp(-2, u - 1, '#3b5dc9'); } hp(0, 3, '#ffcd75'); break;
      case 'lion': for (let f = -3; f <= 2; f++) { hp(f, 2, '#c08a40'); hp(f, 3, '#8a5a3c'); } hp(-3, 1, '#c08a40'); hp(-4, 0, '#8a5a3c'); hp(-4, -1, '#8a5a3c'); hp(2, 4, OUT); hp(-2, 4, OUT); break;
      default: break;
    }
    };
    const hand = J.an[2];
    const inverted = up[1] > 0.3 || ((hand[0] - J.sh[0]) * up[0] + (hand[1] - J.sh[1]) * up[1]) > 1;
    if (!inverted) drawHead();
    // Bras avant (par-dessus la tête quand il passe devant)
    drawLimb(P, J.an, wA, wA, sleeveU(skin), sleeveL(skin), skin, 2);
    // Arme tenue
    if (opts && opts.weapon) drawWeapon(P, J.an[2], opts.weapon, J);
    if (inverted) drawHead();
    return P;
  }

  function drawWeapon(P, hand, w, J) {
    const c = w.c || '#94b0c2', dk = shade(c, 0.6), lt = shade(c, 1.4);
    const [x, y] = [Math.round(hand[0]), Math.round(hand[1])];
    const S = (dx, dy, col) => P.set(x + dx, y + dy, col);
    switch (w.icon) {
      case 'dumbbell': for (let i = -2; i <= 2; i++) S(i, 0, '#94b0c2'); for (const sx of [-3, 3]) for (let j = -2; j <= 2; j++) S(sx, j, j === -2 ? lt : c); for (const sx of [-4, 4]) for (let j = -1; j <= 1; j++) S(sx, j, dk); break;
      case 'kettlebell': S(0, -1, '#566c86'); S(-1, -1, '#566c86'); S(1, -1, '#566c86'); for (let i = -2; i <= 2; i++) for (let j = 1; j <= 4; j++) S(i, j, j === 1 ? lt : c); S(-2, 4, dk); S(2, 4, dk); break;
      case 'whip': { const t = Date.now() / 120; for (let i = 0; i < 8; i++) S(i + 1, Math.round(Math.sin(t + i * 0.7) * 1.5) - 1, i < 2 ? dk : c); break; }
      case 'staff': for (let i = -6; i <= 6; i++) S(Math.round(i * 0.4), i, i === -6 || i === 6 ? lt : c); break;
      case 'sword': for (let i = 1; i <= 8; i++) S(i, -i, i > 6 ? '#ffffff' : lt); S(-1, 1, dk); S(0, 0, c); S(1, 1, c); S(-1, -1, c); break;
      case 'bar': for (let i = -6; i <= 6; i++) S(i, 0, i % 3 === 0 ? lt : c); break;
      case 'plate': for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) if (i * i + j * j <= 5) S(i, j, i * i + j * j <= 1 ? OUT : c); break;
      default: for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) S(i, j, c); break;
    }
  }

  function flushPix(ctx, P, ox, oy, s, flip, tint) {
    for (const [k, c] of P.m) {
      const i = k.indexOf(',');
      const x = +k.slice(0, i), y = +k.slice(i + 1);
      ctx.fillStyle = tint || c;
      ctx.fillRect(ox + (flip ? -x - 1 : x) * s, oy + y * s, s, s);
    }
  }

  // Accessoires de décor associés aux poses
  function propPixels(props, time, J) {
    const P = new Pix();
    if (!props) return P;
    const M = '#94b0c2', MD = '#566c86', W = '#8a5a3c';
    for (const pr of props) {
      if (pr.k === 'bar') {
        for (let x = pr.x0; x <= pr.x1; x++) { P.set(x, pr.y - 1, OUT); P.set(x, pr.y, M); P.set(x, pr.y + 1, OUT); }
        for (const px of [pr.x0, pr.x1]) for (let y = pr.y - 1; y <= 0; y++) { P.set(px - 1, y, OUT); P.set(px, y, MD); P.set(px + 1, y, OUT); }
      } else if (pr.k === 'dip') {
        for (let x = -9; x <= 9; x++) { P.set(x, pr.y - 1, OUT); P.set(x, pr.y, M); P.set(x, pr.y + 1, OUT); }
        for (const px of [-8, 8]) for (let y = pr.y + 1; y <= 0; y++) { P.set(px, y, MD); P.set(px + 1, y, OUT); }
      } else if (pr.k === 'par') {
        for (let x = -4; x <= 4; x++) { P.set(x, pr.y - 1, OUT); P.set(x, pr.y, M); }
        for (const px of [-4, 4]) for (let y = pr.y + 1; y <= 0; y++) P.set(px, y, MD);
      } else if (pr.k === 'wall') {
        for (let x = pr.x - 7; x <= pr.x; x++) for (let y = -44; y <= 0; y++) {
          const brick = ((y + 44) % 4 === 0) || ((x + ((Math.floor((y + 44) / 4) % 2) * 3)) % 6 === 0);
          P.set(x, y, x === pr.x ? OUT : brick ? '#7a3a3a' : '#a0524a');
        }
      } else if (pr.k === 'pole') {
        for (let y = -44; y <= 0; y++) { P.set(pr.x - 1, y, OUT); P.set(pr.x, y, M); P.set(pr.x + 1, y, MD); P.set(pr.x + 2, y, OUT); }
      } else if (pr.k === 'bench') {
        for (let x = pr.x0; x <= pr.x1; x++) { P.set(x, pr.y - 1, OUT); P.set(x, pr.y, W); P.set(x, pr.y + 1, '#5b3a29'); P.set(x, pr.y + 2, OUT); }
        for (const px of [pr.x0 + 2, pr.x1 - 2]) for (let y = pr.y + 3; y <= 0; y++) P.set(px, y, MD);
      } else if (pr.k === 'rope' && J) {
        const a = J.an[2], b = J.af[2];
        const ph = (time * 2) % 1; // tour de corde
        const ext = Math.cos(ph * Math.PI * 2);
        const midY = ext > 0 ? 2 : -30;
        const n = 16;
        for (let i = 0; i <= n; i++) {
          const u = i / n;
          const x = a[0] + (b[0] - a[0]) * u;
          const y0 = a[1] + (b[1] - a[1]) * u;
          const bulge = Math.sin(u * Math.PI);
          P.set(x + bulge * (ext > 0 ? 0 : 0), y0 + (midY - y0) * bulge * Math.abs(ext), '#e0667a');
        }
      }
    }
    return P;
  }

  // Dessine le héros (ou un humanoïde) : pose, apparence, position au sol (x, y), échelle et miroir
  function drawFigure(ctx, poseId, look, x, y, o = {}) {
    const s = o.s || 1;
    const time = o.time || 0;
    const p = POSES[poseId] || POSES.idle;
    const J = o.J || poseAt(poseId, time, o.once);
    let sx = 0, sy = 0;
    if (p.shake && !o.noShake) { sx = Math.round(Math.sin(time * 37) * p.shake); sy = 0; }
    const flip = !!o.flip;
    const props = o.noProps ? null : p.props;
    if (props) flushPix(ctx, propPixels(props, time, J), Math.round(x), Math.round(y), s, flip);
    const fx = look.fx && DT.P.heroPixels;
    const P = fx ? DT.P.heroPixels(J, look, { time, weapon: o.weapon, pose: p, poseId, back: o.weaponBack }) : figurePixels(J, look, { time, weapon: o.weapon });
    const ox = Math.round(x) + sx * s, oy = Math.round(y) + sy * s;
    if (P.glow && !o.tint) flushPix(ctx, P.glow, ox, oy, s, flip);
    if (P.alpha && !o.tint) ctx.globalAlpha = P.alpha;
    flushPix(ctx, P, ox, oy, s, flip, o.tint);
    ctx.globalAlpha = 1;
    if (P.sparks && !o.tint) for (const sp of P.sparks) { ctx.fillStyle = sp.c; ctx.fillRect(ox + (flip ? -sp.x - 1 : sp.x) * s, oy + sp.y * s, s, s); }
  }
  function figureBounds(poseId) {
    const p = POSES[poseId] || POSES.idle;
    let x0 = 99, x1 = -99, y0 = 99, y1 = -99;
    const acc = (pt) => { x0 = Math.min(x0, pt[0]); x1 = Math.max(x1, pt[0]); y0 = Math.min(y0, pt[1]); y1 = Math.max(y1, pt[1]); };
    for (let i = 0; i < p.R.length; i++) {
      const J = joints(p.R[i], p.R[i], 0);
      [J.hip, J.sh, J.head, ...J.an, ...J.af, ...J.ln, ...J.lf].forEach(acc);
      acc([J.head[0] - 3, J.head[1] - 3]); acc([J.head[0] + 3, J.head[1] + 3]);
    }
    if (p.props) for (const pr of p.props) {
      if (pr.k === 'bar') { acc([pr.x0, pr.y]); acc([pr.x1, pr.y]); }
      if (pr.k === 'pole') acc([pr.x, -44]);
      if (pr.k === 'wall') { acc([pr.x - 7, -44]); }
      if (pr.k === 'bench') { acc([pr.x0, 0]); acc([pr.x1, 0]); }
    }
    acc([0, 0]);
    return { x0, x1, y0, y1 };
  }
  // Vignette statique d'une pose (pour les listes)
  const thumbCache = {};
  function poseThumb(poseId, look, size = 48, frame = 0, sil) {
    const key = poseId + JSON.stringify(look) + size + frame + (sil || '');
    if (thumbCache[key]) return thumbCache[key];
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const b = figureBounds(poseId);
    const ox = Math.round(size / 2 - (b.x0 + b.x1) / 2);
    const oy = Math.round(size / 2 - (b.y0 + b.y1) / 2);
    // sol
    ctx.fillStyle = '#333c57';
    ctx.fillRect(0, oy + 1, size, size - oy - 1);
    ctx.fillStyle = '#566c86';
    ctx.fillRect(0, oy + 1, size, 1);
    const p = POSES[poseId] || POSES.idle;
    const J = joints(p.R[frame % p.R.length], p.R[frame % p.R.length], 0);
    drawFigure(ctx, poseId, look, ox, oy, { J, noShake: true, tint: sil || null, noProps: !!sil });
    return (thumbCache[key] = c.toDataURL());
  }

  // ---------- Scène : canvas basse résolution agrandi sans lissage ----------
  function Stage(canvas, w, h) {
    this.cv = canvas; this.w = w; this.h = h;
    this.low = document.createElement('canvas');
    this.low.width = w; this.low.height = h;
    this.lc = this.low.getContext('2d');
    this.ctx = canvas.getContext('2d');
    this.s = 1; this.dpr = 1;
    this.resize();
  }
  Stage.prototype.resize = function () {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const cssW = this.cv.parentElement ? this.cv.parentElement.clientWidth : 320;
    if (!cssW) return;
    const phys = Math.floor(cssW * dpr);
    const s = Math.max(1, Math.floor(phys / this.w));
    this.s = s; this.dpr = dpr;
    this.cv.width = this.w * s; this.cv.height = this.h * s;
    this.cv.style.width = (this.w * s / dpr) + 'px';
    this.cv.style.height = (this.h * s / dpr) + 'px';
    this.ctx.imageSmoothingEnabled = false;
  };
  Stage.prototype.present = function () {
    if (this.cv.width !== this.w * this.s) this.resize();
    this.ctx.imageSmoothingEnabled = false;
    this.ctx.drawImage(this.low, 0, 0, this.w * this.s, this.h * this.s);
  };
  // Texte net au-dessus de la scène (coordonnées en pixels de jeu)
  Stage.prototype.text = function (str, x, y, o = {}) {
    const ctx = this.ctx, s = this.s;
    const px = Math.max(8, Math.round((o.size || 4) * s / 8) * 8);
    ctx.font = px + 'px "Press Start 2P", monospace';
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'alphabetic';
    const X = Math.round(x * s), Y = Math.round(y * s);
    if (o.bg) {
      const w = ctx.measureText(str).width;
      const pad = Math.round(px / 4);
      const bx = o.align === 'left' ? X - pad : o.align === 'right' ? X - w - pad : X - w / 2 - pad;
      ctx.fillStyle = o.bg;
      ctx.fillRect(Math.round(bx), Y - px - pad, Math.round(w + pad * 2), px + pad * 2);
    }
    if (o.shadow !== false) { ctx.fillStyle = OUT; ctx.fillText(str, X + Math.max(1, s / 2), Y + Math.max(1, s / 2)); }
    ctx.fillStyle = o.color || '#f4f4f4';
    ctx.fillText(str, X, Y);
  };

  // ---------- Décors ----------
  function band(ctx, y0, y1, c1, c2, w) {
    // dégradé tramé entre deux couleurs
    const n = y1 - y0;
    for (let y = y0; y < y1; y++) {
      const t = (y - y0) / n;
      for (let x = 0; x < w; x++) {
        const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]][y % 4][x % 4] / 16;
        ctx.fillStyle = t > bayer ? c2 : c1;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  function sky(ctx, w, h, cols) {
    const n = cols.length - 1, step = h / n;
    for (let i = 0; i < n; i++) band(ctx, Math.round(i * step), Math.round((i + 1) * step), cols[i], cols[i + 1], w);
  }
  function tree(ctx, x, y, r, c1, c2) {
    ctx.fillStyle = '#5b3a29'; ctx.fillRect(x - 1, y - 2, 3, r + 4);
    for (let dx = -r - 1; dx <= r + 1; dx++) for (let dy = -r - 1; dy <= r + 1; dy++) {
      const d = dx * dx + dy * dy * 1.3;
      if (d <= (r + 1) * (r + 1)) { ctx.fillStyle = OUT; ctx.fillRect(x + dx, y + dy - r, 1, 1); }
    }
    for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
      const d = dx * dx + dy * dy * 1.3;
      if (d <= r * r) { ctx.fillStyle = (dx - dy > r * 0.4) ? c2 : c1; ctx.fillRect(x + dx, y + dy - r, 1, 1); }
    }
  }
  function skyline(ctx, w, base, col, win, seed, maxH) {
    const r = DT.U.rng(seed);
    let x = 0;
    while (x < w) {
      const bw = 6 + Math.floor(r() * 10), bh = 6 + Math.floor(r() * maxH);
      ctx.fillStyle = col; ctx.fillRect(x, base - bh, bw, bh);
      if (win) for (let wy = base - bh + 2; wy < base - 2; wy += 3) for (let wx = x + 1; wx < x + bw - 1; wx += 2) if (r() < 0.3) { ctx.fillStyle = win; ctx.fillRect(wx, wy, 1, 1); }
      x += bw + Math.floor(r() * 3);
    }
  }
  function stars(ctx, w, h, seed, n) {
    const r = DT.U.rng(seed);
    for (let i = 0; i < n; i++) { ctx.fillStyle = r() < 0.3 ? '#ffcd75' : '#f4f4f4'; ctx.fillRect(Math.floor(r() * w), Math.floor(r() * h), 1, 1); }
  }
  function period(hour) {
    if (hour >= 6 && hour < 8) return 'dawn';
    if (hour >= 8 && hour < 18) return 'day';
    if (hour >= 18 && hour < 21) return 'dusk';
    return 'night';
  }
  const SKIES = {
    dawn: ['#5d275d', '#b13e53', '#ef7d57', '#ffcd75'],
    day: ['#3b5dc9', '#41a6f6', '#73eff7', '#c2f5f8'],
    dusk: ['#29366f', '#5d275d', '#b13e53', '#ef7d57'],
    night: ['#1a1c2c', '#1a1c2c', '#29366f', '#3b5dc9'],
  };
  const bgCache = {};
  function bgCanvas(key, w, h, painter) {
    if (bgCache[key]) return bgCache[key];
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    painter(ctx, w, h);
    return (bgCache[key] = c);
  }
  // Parc : le ciel suit l'heure réelle du joueur
  function parkBg(w, h) {
    const per = period(new Date().getHours());
    return bgCanvas('park' + per + w + 'x' + h, w, h, (ctx) => {
      const night = per === 'night';
      sky(ctx, w, 64, SKIES[per]);
      if (night) { stars(ctx, w, 50, 7, 40); }
      // soleil / lune
      const sun = per === 'night' ? ['#f4f4f4', '#c2d3de'] : per === 'day' ? ['#ffcd75', '#fff3c0'] : ['#ffcd75', '#ef7d57'];
      const sx = per === 'dawn' ? 20 : per === 'dusk' ? 135 : 120, sy = per === 'day' ? 12 : 22;
      for (let dx = -5; dx <= 5; dx++) for (let dy = -5; dy <= 5; dy++) if (dx * dx + dy * dy <= 22) { ctx.fillStyle = (dx + dy < -2) ? sun[1] : sun[0]; ctx.fillRect(sx + dx, sy + dy, 1, 1); }
      if (night) { ctx.fillStyle = SKIES.night[1]; for (let dx = -4; dx <= 4; dx++) for (let dy = -5; dy <= 5; dy++) if ((dx - 3) * (dx - 3) + dy * dy <= 18 && dx * dx + dy * dy <= 22) ctx.fillRect(sx + dx, sy + dy, 1, 1); }
      skyline(ctx, w, 60, night ? '#29366f' : per === 'day' ? '#94b0c2' : '#5d275d', night ? '#ffcd75' : null, 3, 22);
      skyline(ctx, w, 64, night ? '#1a1c2c' : per === 'day' ? '#566c86' : '#333c57', night ? '#ef7d57' : null, 11, 12);
      // arbres du fond
      for (let i = 0; i < 9; i++) tree(ctx, 8 + i * 19 + (i % 2) * 5, 66, 5 + (i % 3), night ? '#257179' : '#38b764', night ? '#1a4a50' : '#257179');
      // pelouse
      ctx.fillStyle = night ? '#257179' : '#38b764'; ctx.fillRect(0, 66, w, h - 66);
      ctx.fillStyle = night ? '#38b764' : '#a7f070'; ctx.fillRect(0, 66, w, 1);
      const r = DT.U.rng(5);
      for (let i = 0; i < 120; i++) { ctx.fillStyle = r() < 0.5 ? (night ? '#1a4a50' : '#257179') : (night ? '#38b764' : '#a7f070'); ctx.fillRect(Math.floor(r() * w), 68 + Math.floor(r() * (h - 68)), 1, 1); }
      // allée
      ctx.fillStyle = night ? '#566c86' : '#c8b48a'; ctx.fillRect(0, 84, w, 4);
      ctx.fillStyle = night ? '#333c57' : '#a8946a'; ctx.fillRect(0, 88, w, 2);
      // station de street workout
      const M = '#94b0c2', MD = '#566c86';
      const post = (x, y0) => { ctx.fillStyle = OUT; ctx.fillRect(x - 1, y0, 4, 78 - y0); ctx.fillStyle = MD; ctx.fillRect(x, y0, 2, 78 - y0); };
      post(122, 36); post(150, 36); post(136, 36);
      ctx.fillStyle = OUT; ctx.fillRect(121, 35, 32, 3); ctx.fillStyle = M; ctx.fillRect(122, 36, 30, 1);
      ctx.fillStyle = OUT; ctx.fillRect(135, 47, 16, 3); ctx.fillStyle = M; ctx.fillRect(136, 48, 14, 1);
      // barres parallèles
      post(100, 58); post(113, 58);
      ctx.fillStyle = OUT; ctx.fillRect(99, 57, 17, 3); ctx.fillStyle = M; ctx.fillRect(100, 58, 15, 1);
      // banc
      ctx.fillStyle = OUT; ctx.fillRect(14, 72, 22, 4); ctx.fillStyle = '#8a5a3c'; ctx.fillRect(15, 73, 20, 2);
      ctx.fillStyle = MD; ctx.fillRect(16, 76, 2, 3); ctx.fillRect(32, 76, 2, 3);
      // lampadaire
      ctx.fillStyle = OUT; ctx.fillRect(90, 40, 3, 38); ctx.fillStyle = '#333c57'; ctx.fillRect(91, 40, 1, 38);
      ctx.fillStyle = OUT; ctx.fillRect(88, 38, 7, 3); ctx.fillStyle = night ? '#ffcd75' : '#94b0c2'; ctx.fillRect(89, 39, 5, 1);
      if (night) { ctx.fillStyle = 'rgba(255,205,117,0.12)'; ctx.fillRect(80, 41, 23, 40); }
    });
  }

  const THEMES = {
    park: (ctx, w, h) => {
      sky(ctx, w, 60, SKIES.day);
      skyline(ctx, w, 58, '#94b0c2', null, 2, 18);
      for (let i = 0; i < 8; i++) tree(ctx, 6 + i * 22, 62, 6 + (i % 3), '#38b764', '#257179');
      ctx.fillStyle = '#38b764'; ctx.fillRect(0, 62, w, h - 62);
      ctx.fillStyle = '#a7f070'; ctx.fillRect(0, 62, w, 1);
      ctx.fillStyle = '#c8b48a'; ctx.fillRect(0, 74, w, 16);
      ctx.fillStyle = '#a8946a'; for (let x = 0; x < w; x += 7) ctx.fillRect(x, 78 + (x % 3), 2, 1);
    },
    gym: (ctx, w, h) => {
      ctx.fillStyle = '#333c57'; ctx.fillRect(0, 0, w, h);
      for (let y = 0; y < 62; y += 5) for (let x = (y / 5) % 2 * 6; x < w; x += 12) { ctx.fillStyle = '#29366f'; ctx.fillRect(x, y, 11, 4); }
      for (let i = 0; i < 3; i++) { const x = 18 + i * 52; ctx.fillStyle = OUT; ctx.fillRect(x - 1, 9, 24, 18); ctx.fillStyle = '#5d6a9a'; ctx.fillRect(x, 10, 22, 16); ctx.fillStyle = '#94b0c2'; ctx.fillRect(x + 2, 12, 3, 3); ctx.fillStyle = OUT; ctx.fillRect(x + 10, 12, 1, 12); ctx.fillRect(x + 6, 17, 10, 1); }

    if (!vis && slot === 'weapon' && S().cls && Math.random() < 0.35) vis = D.CLASSES[C.cls()].weapon;
    const names = D.ITEM_NAMES[slot].filter((x) => x[2] === vis);
    const [base, icon] = U.pick(names.length ? names : D.ITEM_NAMES[slot]);
    vis = (names.length ? names[0] : D.ITEM_NAMES[slot].find((x) => x[0] === base))[2];
    const it = { id: U.uid(), slot, n: base + ' ' + U.pick(D.ITEM_SUFFIX[r]), icon, vis, r, ilvl: Math.max(0, Math.round(ilvl)), plus: 0, aff: [] };
    if ((slot === 'weapon' && r >= 4 && Math.random() < (r >= 5 ? 1 : 0.5)) || (slot === 'acc' && r >= 5 && Math.random() < 0.4)) it.ab = U.pick(D.ENCHANTS);
    const nAff = D.RAR[r].aff + (slot === 'acc' ? 1 : 0);
    const pool = U.shuffle(D.AFFIXES);
    for (let i = 0; i < nAff; i++) {
      const a = pool[i];
      it.aff.push([a.k, Math.round(a.v * Math.max(1, r) * U.rand(0.75, 1.25) * 1000) / 1000]);
    }
    return it;
  }
  function makeUnique(key) {
    const u = D.UNIQUES[key];
    return { id: U.uid(), slot: u.slot, n: u.n, icon: u.icon, vis: u.vis, ab: u.ab, r: u.r, ilvl: u.ilvl, plus: 0, aff: u.aff.map((a) => a.slice()), uq: key };
  }
  function addItem(it) {
    const s = S();
    s.inv.push(it);
    if (it.r > s.life.bestRar) s.life.bestRar = it.r;
    // équipe tout seul si l'emplacement est vide
    if (!s.eq[it.slot]) { s.eq[it.slot] = it.id; C.dirty(); syncLoadout(it); E.emit('look'); }
    E.emit('inv');
    checkAch();
    return it;
  }
  const findItem = (id) => S().inv.find((x) => x.id === id);
  // Les capacités d'enchantement suivent l'équipement porté
  function syncLoadout(it) {
    const s = S();
    s.loadout = s.loadout.filter((id) => C.abRank(id) > 0);
    if (it && it.ab && isEquipped(it) && !s.loadout.includes(it.ab) && s.loadout.length < C.abilitySlots()) s.loadout.push(it.ab);
    E.emit('loadout');
  }
  function equip(id) {
    const it = findItem(id);
    if (!it) return;
    S().eq[it.slot] = it.id;
    C.dirty(); syncLoadout(it); E.emit('inv'); E.emit('look');
  }
  function unequip(slot) { delete S().eq[slot]; C.dirty(); syncLoadout(); E.emit('inv'); E.emit('look'); }
  function isEquipped(it) { return S().eq[it.slot] === it.id; }
  function sellValue(it) { return Math.max(10 * (it.r + 1), C.priceBase() * D.RAR[it.r].sec * 0.12 * (1 + it.plus * 0.3)); }
  function sell(id) {
    const s = S(), it = findItem(id);
    if (!it || isEquipped(it) || it.lock) return 0;
    const v = sellValue(it);
    s.inv = s.inv.filter((x) => x.id !== id);
    addCoins(v);
    E.emit('inv'); E.emit('coins');
    return v;
  }
  function sellBelow(maxR) {
    const s = S();
    let tot = 0, n = 0;
    for (const it of s.inv.slice()) if (it.r <= maxR && !isEquipped(it) && !it.lock && !it.uq) { tot += sell(it.id); n++; }
    return { tot, n };
  }
  function upgradeCost(it) { return Math.max(20 * Math.pow(1.6, it.plus), C.priceBase() * 30 * Math.pow(1.6, it.plus) * (1 + it.r * 0.5)); }
  function upgrade(id) {
    const it = findItem(id);
    if (!it || it.plus >= 10) return false;
    if (!spend(upgradeCost(it))) return false;
    it.plus++;
    daily('upgrade');
    C.dirty(); E.emit('inv');
    return true;

  // Armurerie : 8 objets (dont des armes de ta classe), renouvelée toutes les 4 heures
  const SHOP_EVERY = 4 * 3600000;
  function shopRefresh(force) {
    const s = S();
    if (!force && s.shop.items.length && Date.now() - s.shop.t < SHOP_EVERY) return;
    const il = refIlvl();
    const cw = D.CLASSES[C.cls()].weapon;
    s.shop.items = ['weapon', 'weapon', 'head', 'top', 'hands', 'legs', 'feet', 'acc'].map((slot, i) =>
      makeItem(slot, il + U.randInt(-1, 4), rollRarity(1.7, 0, 4), i === 0 ? cw : null));
    s.shop.t = Date.now();
    E.emit('shop');
  }
  const shopPrice = (it) => Math.max(50 * Math.pow(it.r + 1, 2), C.priceBase() * D.RAR[it.r].sec * (1 + it.ilvl / 200)) * (it.ab ? 1.5 : 1);
  // Enchanter une arme ou un accessoire (Rare ou mieux) : lui ajoute une capacité de combat
  const ENCH_GEMS = [0, 0, 25, 50, 90, 150];
  const enchantCost = (it) => ({ gems: ENCH_GEMS[it.r], coins: Math.max(400, C.priceBase() * 500 * it.r) });
  const canEnchant = (it) => (it.slot === 'weapon' || it.slot === 'acc') && it.r >= 2;
  function enchant(id, abId) {
    const s = S(), it = findItem(id);
    if (!it || !canEnchant(it) || !D.ABI[abId] || !D.ABI[abId].ench || it.ab === abId) return false;
    const c = enchantCost(it);
    if (s.gems < c.gems || s.coins < c.coins) return false;
    spendGems(c.gems); spend(c.coins);
    it.ab = abId;
    if (isEquipped(it) && s.loadout.length < C.abilitySlots() && !s.loadout.includes(abId)) s.loadout.push(abId);
    C.dirty(); E.emit('inv'); E.emit('ability');
    return true;
  }
  function buyShop(id) {
    const s = S(), it = s.shop.items.find((x) => x.id === id);
    if (!it || it.sold) return false;
    if (!spend(shopPrice(it))) return false;
    it.sold = true;
    const copy = Object.assign({}, it, { id: U.uid() });
    delete copy.price; delete copy.sold;
    addItem(copy);
    E.emit('shop');
    return copy;
  }
  // ---------- Coffres (6 niveaux) ----------
  const CHEST_PRICE = { 2: 60, 3: 150, 4: 400 };
  function addChest(tier, src) {
    const s = S();
    const ch = { id: U.uid(), t: U.clamp(tier, 0, 5), src: src || '' };
    s.chests.push(ch);
    E.emit('chest');
    return ch;
  }
  function chestCount(tier) { return S().chests.filter((c) => tier == null || c.t === tier).length; }
  function openChest(id) {
    const s = S(), i = s.chests.findIndex((c) => c.id === id);
    if (i < 0) return null;
    const ch = s.chests.splice(i, 1)[0], T = D.CHEST_T[ch.t];
    const out = { tier: ch.t, items: [], coins: Math.max(100, C.priceBase() * T.sec), gems: T.gems, skin: null, pet: null };
    for (let k = 0; k < T.items; k++) out.items.push(addItem(makeItem(null, refIlvl() + ch.t * 2 + U.randInt(0, 4), rollRarity(T.f, T.min, 5))));
    addCoins(out.coins);
    if (out.gems) addGems(out.gems);
    if (Math.random() < T.skin) {
      const pool = D.SKINS.filter((sk) => sk.chest != null && sk.chest <= ch.t && !s.skins.includes(sk.id));
      if (pool.length) { out.skin = U.pick(pool).id; unlockSkin(out.skin); }
    }
    if (Math.random() < [0, 0, 0.01, 0.03, 0.06, 0.12][ch.t]) {
      const pool = D.PETS.filter((p) => !s.pets.includes(p.id));
      if (pool.length) { out.pet = U.pick(pool).id; unlockPet(out.pet); }
    }
    s.life.chests++;
    s.life.bestChest = Math.max(s.life.bestChest == null ? -1 : s.life.bestChest, ch.t);
    daily('chest');
    E.emit('chest'); E.emit('coins');
    checkAch();
    return out;
  }
  const chestUpCost = (t) => { const u = D.CHEST_T[t].up; return u ? { gems: u.gems, coins: Math.max(200, C.priceBase() * u.sec) } : null; };
  function upgradeChest(id) {
    const s = S(), ch = s.chests.find((c) => c.id === id);
    if (!ch || ch.t >= 5) return false;
    const cost = chestUpCost(ch.t);
    if (s.gems < cost.gems || s.coins < cost.coins) return false;
    spendGems(cost.gems); spend(cost.coins);
    ch.t++;
    E.emit('chest');
    return true;
  }
  function fuseChests(tier) {
    const s = S();
    if (tier >= 5 || chestCount(tier) < 3) return null;
    for (let k = 0; k < 3; k++) s.chests.splice(s.chests.findIndex((c) => c.t === tier), 1);
    return addChest(tier + 1, 'fusion');
  }
  function buyChest(tier) {
    const price = CHEST_PRICE[tier];
    if (!price || !spendGems(price)) return null;
    return addChest(tier, 'boutique');
  }

  // ---------- Apparences & familiers ----------
  function unlockSkin(id) {
    const s = S();
    if (s.skins.includes(id) || !D.SKIN[id]) return false;
    s.skins.push(id);
    E.emit('toast', { t: "Nouvelle apparence : " + D.SKIN[id].n, k: 'skin', big: true });
    checkAch();
    return true;
  }
  function buySkin(id) {
    const sk = D.SKIN[id], s = S();
    if (!sk || !sk.price || s.skins.includes(id)) return false;
    if (!spendGems(sk.price)) return false;
    return unlockSkin(id);
  }
  function setSkin(id) { const s = S(); if (s.skins.includes(id)) { s.skin = id; C.dirty(); E.emit('look'); } }
  function unlockPet(id) {
    const s = S();
    if (s.pets.includes(id)) return false;
    s.pets.push(id);
    if (!s.pet) s.pet = id;
    C.dirty();
    E.emit('toast', { t: "Nouveau familier : " + D.PET[id].n, k: 'pet', big: true });
    checkAch();
    return true;
  }
  function setPet(id) { const s = S(); if (id === null || s.pets.includes(id)) { s.pet = id; C.dirty(); E.emit('look'); } }

  // ---------- Donjons à paliers ----------
  // Un palier gagné : pièces, chance d'objet, XP de classe ; tous les 10 paliers, un coffre plus rare
  function floorWin(d, mode, fl, kind) {
    const s = S(), dg = D.DUNGEONS[d], M = D.MODES[mode];
    const F = s.dungeon.floors[dg.id] || (s.dungeon.floors[dg.id] = [0, 0, 0]);
    const best = F[mode] || 0;
    const first = fl > best;
    const r = { coins: 0, gems: 0, items: [], chest: null, first, clear: null, pet: null };
    const dEff = d + (fl - 1) / D.FLOORS;
    r.coins = Math.max(15 * Math.pow(3, dEff), C.priceBase() * 12 * (1 + dEff * 0.3)) * (mode + 1) * (1 + C.bonus('loot')) * (kind === 'boss' ? 4 : kind === 'guard' ? 2 : 1);
    addCoins(r.coins);
    const ilvl = Math.round(dEff * 10) + M.ilvl + U.randInt(0, 3);
    if (kind !== 'mob') {
      r.gems = 1 + d + mode * 2 + (kind === 'boss' ? 3 : 0);
      addGems(r.gems);
      r.items.push(addItem(makeItem(null, ilvl + 2, rollRarity(1.8 * M.rar, 1, 5))));
      const pid = dg.pet;
      if (kind === 'boss' && !s.pets.includes(pid) && Math.random() < 0.03 * (mode + 1)) { unlockPet(pid); r.pet = pid; }
      s.life.bosses++; daily('boss');
    } else if (Math.random() < 0.12 + mode * 0.06) {
      r.items.push(addItem(makeItem(null, ilvl, rollRarity(M.rar, 0, 5))));
    }
    if (Math.random() < 0.08) { s.potions = Math.min(20, s.potions + 1); r.potion = 1; }
    if (fl % 10 === 0) {
      const tier = first ? Math.min(5, fl / 10 + mode) : Math.max(0, fl / 10 - 1 + mode);
      r.chest = addChest(tier, 'palier ' + fl);
    }
    if (first) F[mode] = fl;
    s.life.floors = 0;
    for (const id in s.dungeon.floors) s.life.floors += (s.dungeon.floors[id] || []).reduce((a, b) => a + (b || 0), 0);
    if (s.life.floors >= 100) unlockSkin('givre');
    addClassXP(C.cls(), 6 * (d + 1) * (mode + 1) * (kind === 'mob' ? 1 : 3));
    s.life.wins++;
    daily('win');
    if (first && fl === D.FLOORS) r.clear = dungeonClear(d, mode);
    C.dirty();
    E.emit('coins'); E.emit('dungeon');
    checkAch();
    return r;
  }
  function dungeonClear(d, mode) {
    const s = S(), dg = D.DUNGEONS[d];
    const out = { first: true, skin: null, item: null, pet: null, gems: 0 };
    if (mode === 0) {
      s.dungeon.cleared = D.DUNGEONS.filter((x, i) => C.floor(i, 0) >= D.FLOORS).length;
      if (unlockSkin(dg.first.skin)) out.skin = dg.first.skin;
      out.item = addItem(makeUnique(dg.first.item));
      out.gems = 20 + d * 10;
    } else if (mode === 1) {
      if (unlockPet(dg.pet)) out.pet = dg.pet;
      out.gems = 40 + d * 15;
    } else {
      out.item = addItem(makeItem(null, d * 10 + 15, 5));
      out.gems = 100 + d * 20;
      if (unlockSkin('dragon')) out.skin = 'dragon';
    }
    addGems(out.gems);
    return out;
  }

  // ---------- Classes, capacités, grimoires, potions ----------
  function addClassXP(cls, n) {
    if (!cls || !(n > 0)) return;
    const cd = C.clsData(cls);
    cd.xp += n;
    let ups = 0;
    while (cd.lvl < 50 && cd.xp >= C.clsXpNeed(cd.lvl)) { cd.xp -= C.clsXpNeed(cd.lvl); cd.lvl++; cd.pts++; ups++; }
    if (ups) { C.dirty(); E.emit('clsup', { cls, lvl: cd.lvl }); }
  }
  function setClass(id) {
    const s = S();
    if (!D.CLASSES[id]) return false;
    s.cls = id;
    C.clsData(id);
    // les deux capacités de niveau 1 sont offertes
    for (const a of D.AB) if (a.cls === id && a.lvl === 1 && !s.abRanks[a.id]) s.abRanks[a.id] = 1;
    C.dirty();
    C.autoLoadout();
    E.emit('cls'); E.emit('look');
    return true;
  }
  function rankUp(abId) {
    const s = S(), a = D.ABI[abId];
    if (!a || !a.cls) return false;
    const cd = C.clsData(a.cls), r = s.abRanks[abId] || 0;
    if (cd.lvl < a.lvl || cd.pts < 1 || r >= 5) return false;
    cd.pts--;
    s.abRanks[abId] = r + 1;
    if (r === 0 && a.cls === C.cls() && s.loadout.length < C.abilitySlots()) s.loadout.push(abId);
    C.dirty();
    E.emit('ability');
    return true;
  }
  function toggleLoadout(abId) {
    const s = S();
    if (s.loadout.includes(abId)) s.loadout = s.loadout.filter((x) => x !== abId);
    else if (C.abRank(abId) > 0 && s.loadout.length < C.abilitySlots()) s.loadout.push(abId);
    else return false;
    E.emit('loadout');
    return true;
  }
  const scrollPrice = (a) => (a.scroll.gems ? { gems: a.scroll.gems } : { coins: Math.max(a.scroll.coins, C.priceBase() * a.scroll.coins / 6) });
  function buyScroll(abId) {
    const s = S(), a = D.ABI[abId];
    if (!a || !a.scroll || s.scrolls.includes(abId)) return false;
    const pr = scrollPrice(a);
    if (pr.gems ? !spendGems(pr.gems) : !spend(pr.coins)) return false;
    s.scrolls.push(abId);
    if (s.loadout.length < C.abilitySlots()) s.loadout.push(abId);
    E.emit('ability');
    return true;
  }
  const potionPrice = () => Math.max(60, C.priceBase() * 90);
  function buyPotions(n) {
    const s = S();
    n = Math.min(n, 20 - s.potions);
    if (n <= 0 || !spend(potionPrice() * n)) return 0;
    s.potions += n;
    E.emit('inv');
    return n;
  }

  // ---------- Échanges ----------
  const TRADE_EVERY = 3 * 3600000;
  function trends() {
    const r = U.rng(U.hash('trend' + U.dayIndex()));
    const out = {};
    for (const sl of D.SLOTS) out[sl.id] = Math.round((0.75 + r() * 0.7) * 100) / 100;
    return out;
  }
  function traderMult(tr, it) {
    let m = trends()[it.slot] || 1;
    if (tr.pref === 'weapon') m *= it.slot === 'weapon' ? 1.3 : 0.85;
    else if (tr.pref === 'armor') m *= ['head', 'top', 'hands', 'legs', 'feet'].includes(it.slot) ? 1.25 : 0.85;
    else if (tr.pref === 'acc') m *= it.slot === 'acc' ? 1.35 : 0.85;
    else if (tr.pref === 'rare') m *= it.r >= 3 ? 1.3 : 0.5;
    return m;
  }
  function tradeRefresh(force) {
    const s = S();
    if (!force && s.trade.offers.length && Date.now() - s.trade.t < TRADE_EVERY) return;
    s.trade.offers = D.TRADERS.map((tr) => {
      const isChest = Math.random() < 0.3;
      if (isChest) {
        const tier = U.weighted([[1, 30], [2, 40], [3, 22], [4, 8]]);
        return { id: U.uid(), tr: tr.id, chest: tier, ask: Math.round(D.CHEST_T[tier].val * tr.mk) };
      }
      const slot = tr.pref === 'weapon' ? 'weapon' : tr.pref === 'acc' ? 'acc' : tr.pref === 'armor' ? U.pick(['head', 'top', 'hands', 'legs', 'feet']) : null;
      const it = makeItem(slot, refIlvl() + U.randInt(2, 6), rollRarity(tr.pref === 'rare' ? 3.5 : 2.4, tr.pref === 'rare' ? 3 : 2, 5));
      return { id: U.uid(), tr: tr.id, item: it, ask: Math.round(C.itemValue(it) * tr.mk) };
    });
    s.trade.t = Date.now();
    E.emit('trade');
  }
  function offerPay(offer, ids) {
    const s = S(), tr = D.TRADERS.find((x) => x.id === offer.tr);
    let v = 0;
    for (const id of ids) { const it = s.inv.find((x) => x.id === id); if (it) v += C.itemValue(it) * traderMult(tr, it); }
    return Math.round(v);
  }
  function doTrade(offerId, ids) {
    const s = S(), off = s.trade.offers.find((o) => o.id === offerId);
    if (!off || off.done) return null;
    const items = ids.map((id) => s.inv.find((x) => x.id === id)).filter(Boolean);
    if (!items.length || items.some((it) => isEquipped(it) || it.lock)) return null;
    if (offerPay(off, ids) < off.ask) return null;
    s.inv = s.inv.filter((x) => !ids.includes(x.id));
    off.done = true;
    const out = {};
    if (off.chest != null) out.chest = addChest(off.chest, 'échange');
    else { const it = Object.assign({}, off.item, { id: U.uid() }); out.item = addItem(it); }
    s.life.trades = (s.life.trades || 0) + 1;
    E.emit('trade'); E.emit('inv');
    checkAch();
    return out;
  }
  // Échange entre amis : un objet devient un code, ton pote le récupère
  const SALT = 'dt-pompes-et-dragons';
  function b64e(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64d(str) { return decodeURIComponent(escape(atob(str))); }
  function itemToCode(id) {
    const s = S(), it = s.inv.find((x) => x.id === id);
    if (!it || isEquipped(it) || it.lock) return null;
    const i = Object.assign({}, it);
    delete i.id; delete i.lock;
    const json = JSON.stringify({ v: 1, i, u: U.uid(), n: s.nick });
    const code = 'DT-' + b64e(json) + '-' + U.hash(json + SALT).toString(36);
    s.inv = s.inv.filter((x) => x.id !== id);
    E.emit('inv');
    return code;
  }
  function codeToItem(code) {
    const s = S();
    const m = String(code || '').trim().match(/^DT-([A-Za-z0-9+/=]+)-([a-z0-9]+)$/);
    if (!m) return { err: 'Ce code ne ressemble pas à un code d\'objet.' };
    let json, o;
    try { json = b64d(m[1]); o = JSON.parse(json); } catch (e) { return { err: 'Code illisible : vérifie qu\'il est complet.' }; }
    if (U.hash(json + SALT).toString(36) !== m[2]) return { err: 'Code modifié ou incomplet.' };
    if (!o.i || !D.SLOTS.find((x) => x.id === o.i.slot) || !D.RAR[o.i.r]) return { err: 'Objet inconnu.' };
    if (s.trade.redeemed.includes(o.u)) return { err: 'Ce code a déjà été utilisé.' };
    s.trade.redeemed.push(o.u);
    if (s.trade.redeemed.length > 300) s.trade.redeemed.shift();
    const it = addItem(Object.assign({}, o.i, { id: U.uid(), plus: Math.min(10, o.i.plus || 0) }));
    s.life.trades = (s.life.trades || 0) + 1;
    checkAch();
    return { item: it, from: String(o.n || 'un ami').slice(0, 16) };
  }

  // ---------- Quêtes & succès ----------
  function dailyCheck() {
    const s = S(), di = U.dayIndex();
    if (s.daily.day === di) return false;
    const r = U.rng(U.hash('q' + di + s.created));
    const irl = U.shuffle(D.QUESTS.filter((q) => q.irl), r);
    const game = U.shuffle(D.QUESTS.filter((q) => !q.irl), r);
    s.daily = { day: di, c: {}, q: [irl[0].id, irl[1].id, game[0].id], got: [], all: false, chest: false };
    E.emit('quest');
    return true;
  }
  function questProgress(q) { return Math.min(q.n, S().daily.c[q.key] || 0); }
  function claimQuest(id) {
    const s = S(), q = D.QUESTS.find((x) => x.id === id);
    if (!q || s.daily.got.includes(id) || questProgress(q) < q.n) return null;
    s.daily.got.push(id);
    const coins = Math.max(100, C.priceBase() * q.sec);
    addCoins(coins); addGems(q.gems); addEnergy(3);
    E.emit('quest'); E.emit('coins');
    return { coins, gems: q.gems };
  }
  function claimAllBonus() {
    const s = S();
    if (s.daily.all || s.daily.q.some((id) => !s.daily.got.includes(id))) return null;
    s.daily.all = true;
    E.emit('quest');
    return addChest(1, 'quêtes');
  }
  function claimDailyChest() {
    const s = S();
    if (s.daily.chest) return null;
    s.daily.chest = true;
    const coins = Math.max(200, C.priceBase() * 300);

  // Ennemis d'un palier
  function floorFoes(d, fl, mode) {
    const dg = D.DUNGEONS[d];
    const mk = (def, kind, gf) => {
      const st = C.floorFoe(d, fl, mode, kind);
      const g = gf || [1, 1];
      const f = Object.assign({}, def, { hp: st.hp * g[0], atk: st.atk * g[1], def: st.def, spd: st.spd * U.rand(0.92, 1.08), crit: st.crit, boss: kind !== 'mob', kind, s: kind === 'mob' ? 1 : 2 });
      if (f.spr === 'human') { const w = FOE_WEAPON[def.n.replace('Gardien : ', '')]; f.look = Object.assign({ fx: true }, def.look, w ? { weapon: { vis: w[0], r: w[1] } } : {}); }
      return f;
    };
    if (fl === D.FLOORS) { const out = [mk(dg.boss, 'boss')]; if (mode > 0) out.push(mk(U.pick(dg.foes), 'mob', [0.5, 0.6])); return out; }
    if (fl % 10 === 0) {
      const g = U.pick(dg.foes);
      const guard = mk(Object.assign({}, g, { n: 'Gardien : ' + g.n }), 'guard');
      return fl >= 20 ? [guard, mk(U.pick(dg.foes), 'mob', [0.55, 0.6])] : [guard];
    }

    const GF = [[1, 1], [0.62, 0.72], [0.48, 0.58]][n - 1];
    const out = [];
    for (let k = 0; k < n; k++) out.push(mk(U.pick(dg.foes), 'mob', GF));
    return out;
  }

(function (DT) {

  // ---------- Animation de pose réutilisable ----------
  function PoseAnim(poseId, o = {}) {

      lc.fillStyle = '#333c57'; lc.fillRect(0, hh - 6, w, 6);
      lc.fillStyle = '#566c86'; lc.fillRect(0, hh - 6, w, 1);
      const b = P.figureBounds(pose);
      const ox = Math.round(w / 2 - (b.x0 + b.x1) / 2) + (o.dx || 0);

  }

  function wakeLock() {

  }

  // ---------- Enregistreur d'exercice ----------
  function gainsPreview(ex, n, mult = 1) {
    const pe = n * ex.rv * mult;

  }

    const S = DT.S;
    const brs = new Set(cats);
    const cand = D.SKILLS.filter((s) => !S.skills[s.id] && s.pre.every((p) => S.skills[p]) && (brs.has(s.br) || brs.size === 0)).sort((a, b) => a.t - b.t);

  function generate(cfg) {
    const lv = cfg.level, focus = D.FOCUS.find((f) => f.id === cfg.focus) || D.FOCUS[0];

    const item = (arr, sets, rest, extra) => ({ n: arr[0], exo: arr[1], mult: arr[2], unit: arr[3], amt: rnd(arr[4], arr[5], arr[3]), sets, rest, ...(extra || {}) });
    // échauffement
    const wu = U.shuffle(D.WARMUP).slice(0, cfg.dur <= 15 ? 3 : 4).map((w) => item(w, 1, 10));
    blocks.push({ n: 'Échauffement', items: wu });
    // travail de skill
    if (cfg.dur >= 30) {
      const sk = targetSkill(focus.cats.concat(cfg.focus === 'skills' ? ['skill'] : []));
      if (sk) {
        const [exo, mult, amt] = sk.drill, ex = D.EXO[exo];
        blocks.push({ n: 'Objectif skill : ' + sk.n, items: [{ n: ex.n + (mult !== 1 ? ' (version ' + sk.n + ')' : ''), exo, mult, unit: ex.unit, amt, sets: 3, rest: Math.max(60, cfg.rest), skill: sk.id, tip: sk.tip }] });
      }
    }
    // force
    const nStr = { 15: 3, 30: 4, 45: 5, 60: 6 }[cfg.dur] || 4;
    const used = new Set();
    const str = [];
    for (let i = 0; i < nStr; i++) {
      const cat = focus.cats[i % focus.cats.length];
      let pool = D.LIB[cat][lv].filter((x) => (cfg.bar || !x[6]) && !used.has(x[0]));
      if (!pool.length) pool = D.LIB[cat][Math.max(0, lv - 1)].filter((x) => (cfg.bar || !x[6]) && !used.has(x[0]));
      if (!pool.length) pool = D.LIB.core[lv].filter((x) => !used.has(x[0]));
      if (!pool.length) continue;
      const x = U.pick(pool);
      used.add(x[0]);
      str.push(item(x, cfg.dur >= 45 ? 4 : 3, cfg.rest));
    }
    blocks.push({ n: 'Force', items: str });
    // finisher
    if (cfg.dur >= 30) {
      const fin = U.shuffle(D.LIB.cardio[lv].filter((x) => cfg.bar || !x[6])).slice(0, 2).map((x) => item(x, 2, 20));
      fin.push(item(['Gainage', 'plank', 1, 'sec', 30, 45], 2, 30));

    let sec = 0, pe = 0;

  function run(d, mode, start) {

    const end = Math.min(D.FLOORS, Math.floor((start - 1) / 10) * 10 + 10);
    let fl = start, revived = false, contT = 0;
    const loot = { coins: 0, gems: 0, items: [], chests: [], potions: 0, n: 0, clear: null, pet: null };
    const api = battleSheet({
      theme: dg.theme, title: dg.n + (mode ? ' · ' + D.MODES[mode].n : ''),
      onResult(fight, api) {

          if (fl >= end) { api.finish('clear'); return; }

            h('p', {}, '+' + U.fmt(r.coins) + ' pièces' + (r.gems ? ' · +' + r.gems + ' éclats' : '') + (r.items.length ? ' · ' + r.items.length + ' objet' + (r.items.length > 1 ? 's' : '') : '') + (r.potion ? ' · +1 potion' : '')),

            h('small', { class: 'muted', text: 'Repos : +25 % PV, +30 % mana. Suivant : ' + floorLabel(fl + 1) + '.' }),
            h('div', { class: 'row gap center' },
              UI.btn('Continuer', () => go(), { cls: 'go' }),
              UI.btn('Rentrer', () => api.finish('home'), { cls: 'ghost' }))];
          api.overlay(nodes);
          const go = () => { clearTimeout(contT); fl++; api.rest(0.25, 0.3); api.next(BT.floorFoes(d, fl, mode), floorLabel(fl)); };
          if (S.settings.auto && !r.chest) contT = setTimeout(go, 1800 / (S.settings.speed || 1));

        let text = loot.n + ' palier' + (loot.n > 1 ? 's' : '') + ' franchi' + (loot.n > 1 ? 's' : '') + ' · record ' + best + '/' + D.FLOORS + '.';
        if (c) text = 'Tu as vaincu ' + dg.boss.n + ' en ' + D.MODES[mode].n + ' ! ' + text;
        else if (reason === 'dead' && !loot.n) text = 'Monte ta classe en t\'entraînant, améliore ton stuff ou apprends des capacités, puis reviens.';

          skin: c && c.skin, pet: (c && c.pet) || loot.pet, sound: reason === 'dead' ? 'lose' : 'win', okLabel: 'Retour' });
